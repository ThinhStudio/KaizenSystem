};

}

let db;
function load() {
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch { db = null; }
  if (!db) db = seed();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { /* quota: keep in memory */ } }
function resetDemo() { db = seed(); save(); }

class HttpErr extends Error { constructor(s, m) { super(m); this.status = s; } }
const err = (s, m) => { throw new HttpErr(s, m); };
const user = (id) => db.users.find((u) => u.id === id);
const nameOf = (id) => user(id)?.full_name ?? null;
const ideaOf = (id) => db.ideas.find((i) => i.id === +id) || err(404, 'not found');

function canView(c, i) {
  if (i.submitter_id === c.id || i.assignee_id === c.id) return true;
  if (c.role === 'WORKER') return false;
  if (c.role === 'LEADER') return c.workshop_id === i.workshop_id;
  return true;
}

function toDataURL(file) {
  return new Promise((ok) => {
    if (!file.type.startsWith('image/')) { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(file); return; }
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 800 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = img.width * s; cv.height = img.height * s;
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => ok(PIXEL('#888'));
    img.src = url;
  });
}

async function addFiles(ideaId, uid, phase, files) {
  for (const f of files) {
    if (!f || !f.size) continue;
    db.attachments.push({ id: ++db.seq.att, idea_id: ideaId, phase, file_name: f.name, content_type: f.type.startsWith('image/') ? 'image/jpeg' : f.type,
      size_bytes: f.size, data: await toDataURL(f), created_at: now() });
  }
}

function grant(i, by) {
  if (db.rewards.some((r) => r.idea_id === i.id)) return;
  const fin = db.financials.find((f) => f.idea_id === i.id && f.verified);
  const major = i.kaizen_type === 'MAJOR';
  db.rewards.push({ id: ++db.seq.rw, idea_id: i.id, user_id: i.submitter_id, points: major ? 50 : 10,
    amount: major && fin ? Math.round(fin.annual_saving * 0.01) : 0, reason: major ? 'MAJOR_PROJECT_COMPLETED' : 'QUICK_WIN_COMPLETED', status: 'GRANTED', created_at: now(), granted_by: by });
}

const finView = (f) => f && ({ ...f, roi_percent: f.investment_cost > 0 ? Math.round((f.annual_saving - f.investment_cost) / f.investment_cost * 10000) / 100 : null,
  payback_months: f.annual_saving > 0 ? Math.round(f.investment_cost / f.annual_saving * 1200) / 100 : null });

function upsertFin(id, inv, sav, verify) {
  let f = db.financials.find((x) => x.idea_id === id);
  if (!f) { f = { idea_id: id, investment_cost: 0, annual_saving: 0, currency: 'VND', verified: false, verified_at: null }; db.financials.push(f); }
  if (inv != null) f.investment_cost = +inv;
  if (sav != null) f.annual_saving = +sav;
  if (verify) { f.verified = true; f.verified_at = now(); }
}

function listRow(i) {
  const thumb = db.attachments.find((a) => a.idea_id === i.id && a.content_type.startsWith('image/'));
  return { ...i, category: db.categories.find((c) => c.id === i.category_id)?.name, workshop: db.workshops.find((w) => w.id === i.workshop_id)?.name,
    line: db.lines.find((l) => l.id === i.line_id)?.name ?? null, submitter: nameOf(i.submitter_id), assignee: nameOf(i.assignee_id), thumb_id: thumb?.id ?? null };
}

function pendingFor(c) {
  return db.approvals.filter((a) => a.status === 'PENDING' && (c.role === 'ADMIN'
    || (c.role === 'LEADER' && a.level === 'LEADER' && a.workshop_id === c.workshop_id)
    || (['IE', 'FINANCE'].includes(c.role) && a.approver_role === c.role)));
}

async function handle(method, path, body, c) {
  const p = path.split('?')[0].split('/').filter(Boolean);
  const q = new URLSearchParams(path.split('?')[1] || '');
  const r = `${method} /${p.map((s) => (/^\d+$/.test(s) ? ':id' : s)).join('/')}`;
  const id = +p.find((s) => /^\d+$/.test(s));
  const field = (k) => (body instanceof FormData ? body.get(k) : body?.[k]);

  switch (r) {
    case 'POST /auth/login': {
      const u = db.users.find((x) => x.employee_code === String(field('employee_code')).trim());
      if (!u) err(401, 'Sai mã nhân viên. Chọn một tài khoản demo bên dưới.');
      return { token: 'demo:' + u.id, user: { uid: u.id, role: u.role, fid: u.factory_id, wid: u.workshop_id, name: u.full_name } };
    }
    case 'GET /auth/me':
      return { ...c, total_points: db.rewards.filter((x) => x.user_id === c.id).reduce((s, x) => s + x.points, 0) };
    case 'GET /me/rewards':
      return db.rewards.filter((x) => x.user_id === c.id).map((x) => ({ ...x, code: ideaOf(x.idea_id).code, title: ideaOf(x.idea_id).title }));
    case 'GET /categories': return db.categories;
    case 'GET /master': return { factories: db.factories, workshops: db.workshops, lines: db.lines };
    case 'GET /lines/qr/' + p[2]: {
      const l = db.lines.find((x) => x.qr_token === p[2]) || err(404, 'line not found');
      return { ...l, workshop_name: db.workshops.find((w) => w.id === l.workshop_id).name };
    }
    case 'GET /kaizens': {
      const st = q.get('status');
      const items = db.ideas.filter((i) => canView(c, i) && (!st || st.split(',').includes(i.status)))
        .sort((a, b) => b.created_at.localeCompare(a.created_at)).map(listRow);
      return { items, page: 1, page_size: 50, total: items.length };
    }
    case 'POST /kaizens': {
      const title = String(field('title') || '').trim(), problem = String(field('problem') || '').trim(), proposal = String(field('proposal') || '').trim();
      if (!title || !problem || !proposal || !+field('category_id')) err(400, 'Cần nhập tiêu đề, hiện trạng, giải pháp và lĩnh vực');
      const cu = field('client_uuid');
      const dup = cu && db.ideas.find((i) => i.client_uuid === cu);
      if (dup) return { id: dup.id, duplicate: true };
      const line = db.lines.find((l) => l.qr_token === field('line_qr') || l.id === +field('line_id')) || db.lines.find((l) => l.id === c.line_id) || db.lines[0];
      const i = { id: ++db.seq.idea, code: `KZ-2026-${String(++db.seq.code).padStart(6, '0')}`, client_uuid: cu, title, problem, proposal,
        expected_benefit: field('expected_benefit') || null, category_id: +field('category_id'), submitter_id: c.id, factory_id: 1,
        workshop_id: line.workshop_id, line_id: line.id, kaizen_type: null, status: 'DRAFT', assignee_id: null,
        estimated_saving: +field('estimated_saving') || 0, submitted_at: null, completed_at: null, created_at: now(), updated_at: now() };
      db.ideas.push(i);
      if (body instanceof FormData) await addFiles(i.id, c.id, 'BEFORE', body.getAll('before'));
      if (String(field('submit')) === 'true') submit(i);
      return { id: i.id, code: i.code, status: i.status };
    }
    case 'GET /kaizens/:id': {
      const i = ideaOf(id);
      if (!canView(c, i)) err(403, 'forbidden');
      return { ...listRow(i), attachments: db.attachments.filter((a) => a.idea_id === i.id),
        approvals: db.approvals.filter((a) => a.idea_id === i.id).map((a) => ({ ...a, acted_by: nameOf(a.acted_by) })),
        tasks: db.tasks.filter((t) => t.idea_id === i.id).sort((a, b) => a.position - b.position).map((t) => ({ ...t, assignee: nameOf(t.assignee_id) })),
        rewards: db.rewards.filter((x) => x.idea_id === i.id).map((x) => ({ ...x, full_name: nameOf(x.user_id) })),
        financials: finView(db.financials.find((f) => f.idea_id === i.id)) || null };
    }
    case 'POST /kaizens/:id/submit': {
      const i = ideaOf(id);
      if (i.submitter_id !== c.id) err(403, 'Chỉ người đề xuất được gửi duyệt');
      submit(i); return { status: i.status };
    }
    case 'POST /kaizens/:id/attachments': {
      const i = ideaOf(id);
      if (!canView(c, i)) err(403, 'forbidden');
      await addFiles(i.id, c.id, String(body.get('phase')).toUpperCase(), body.getAll('files'));
      return { uploaded: body.getAll('files').length };
    }
    case 'POST /kaizens/:id/complete': {
      const i = ideaOf(id), owner = i.assignee_id === c.id;
      const after = db.attachments.some((a) => a.idea_id === i.id && a.phase === 'AFTER');
      if (i.status === 'QUICK_WIN') {
        if (!(owner || ['LEADER', 'ADMIN'].includes(c.role))) err(403, 'forbidden');
        if (!after) err(422, 'Cần tải ít nhất một ảnh After trước khi hoàn thành');
        i.status = 'COMPLETED'; i.completed_at = now(); grant(i, c.id);
      } else if (i.status === 'IMPLEMENTING') {
        if (!(owner || ['IE', 'ADMIN'].includes(c.role))) err(403, 'forbidden');
        const open = db.tasks.filter((t) => t.idea_id === i.id && t.status !== 'DONE').length;
        if (open) err(422, `Còn ${open} công việc chưa DONE`);
        if (!after) err(422, 'Cần tải ít nhất một ảnh After trước khi hoàn thành');
        i.status = 'PENDING_FINANCE';
        db.approvals.push({ id: ++db.seq.ap, idea_id: i.id, level: 'FINANCE', approver_role: 'FINANCE', status: 'PENDING', created_at: now() });
      } else err(409, 'Không thể hoàn thành ở trạng thái ' + i.status);
      return { status: i.status };
    }
    case 'PUT /kaizens/:id/financials':
      if (!['IE', 'FINANCE', 'ADMIN'].includes(c.role)) err(403, 'forbidden');
      upsertFin(ideaOf(id).id, body.investment_cost, body.annual_saving, false); return { ok: true };
    case 'GET /approvals/pending':
      return pendingFor(c).map((a) => { const i = listRow(ideaOf(a.idea_id));
        return { approval_id: a.id, level: a.level, pending_since: a.created_at, idea_id: i.id, code: i.code, title: i.title, status: i.status,
          estimated_saving: i.estimated_saving, workshop: i.workshop, submitter: i.submitter, category: i.category,
          waiting_hours: Math.round((Date.now() - new Date(a.created_at)) / 36e5) }; });
    case 'POST /approvals/:id/action': {
      const a = db.approvals.find((x) => x.id === id) || err(404, 'approval not found');
      if (a.status !== 'PENDING') err(409, 'Đã được xử lý');
      if (!pendingFor(c).includes(a)) err(403, 'Bạn không có quyền duyệt cấp này');
      const action = String(body.action).toUpperCase();
      if (action !== 'APPROVE' && !String(body.comment || '').trim()) err(400, 'Cần nhập lý do khi từ chối hoặc yêu cầu sửa');
      const i = ideaOf(a.idea_id);
      let next;
      if (action === 'REJECT') next = 'REJECTED';
      else if (action === 'REVISION') next = a.level === 'FINANCE' ? 'IMPLEMENTING' : 'REVISION_REQUESTED';
      else if (a.level === 'LEADER') {
        if (body.kaizen_type === 'QUICK_WIN') { next = 'QUICK_WIN'; i.kaizen_type = 'QUICK_WIN'; i.assignee_id = i.submitter_id; }
        else if (body.kaizen_type === 'MAJOR') { next = 'PENDING_IE'; i.kaizen_type = 'MAJOR';
          db.approvals.push({ id: ++db.seq.ap, idea_id: i.id, level: 'IE', approver_role: 'IE', status: 'PENDING', created_at: now() }); }
        else err(400, 'Chọn Quick Win hoặc Dự án lớn');
      } else if (a.level === 'IE') { next = 'IMPLEMENTING'; i.assignee_id = body.assignee_id || 4; }
      else { upsertFin(i.id, body.investment_cost, body.annual_saving, true); next = 'COMPLETED'; }
      Object.assign(a, { status: { APPROVE: 'APPROVED', REJECT: 'REJECTED', REVISION: 'REVISION' }[action], acted_by: c.id, comment: body.comment || null, acted_at: now() });
      i.status = next; i.updated_at = now();
      if (next === 'COMPLETED') { i.completed_at = now(); grant(i, c.id); }
      return { status: next };
    }
    case 'POST /kaizens/:id/tasks': {
      const i = ideaOf(id);
      if (!String(body.title || '').trim()) err(400, 'Cần nhập tên công việc');
      db.tasks.push({ id: ++db.seq.task, idea_id: i.id, title: body.title.trim(), status: 'TODO', assignee_id: null, due_date: body.due_date || null,
        position: db.tasks.filter((t) => t.idea_id === i.id).length + 1 });
      return { id: db.seq.task };
    }
    case 'PATCH /kaizens/tasks/:id/status': {
      const t = db.tasks.find((x) => x.id === id) || err(404, 'task not found');
      t.status = String(body.status).toUpperCase(); return { status: t.status };
    }
    case 'GET /reports/summary': {
      const v = db.ideas.filter((i) => canView(c, i)), sub = v.filter((i) => i.status !== 'DRAFT');
      const cnt = (f) => v.filter(f).length, done = cnt((i) => i.status === 'COMPLETED');
      const active = cnt((i) => !['DRAFT', 'REJECTED'].includes(i.status));
      const fin = db.financials.filter((f) => f.verified && v.some((i) => i.id === f.idea_id));
      const leaderHrs = db.approvals.filter((a) => a.level === 'LEADER' && a.acted_at).map((a) => (new Date(a.acted_at) - new Date(a.created_at)) / 36e5);
      const byCat = {}; sub.forEach((i) => { const n = listRow(i).category; byCat[n] = (byCat[n] || 0) + 1; });
      const top = {}; db.rewards.forEach((x) => { const u = user(x.user_id); const k = u.full_name;
        top[k] ??= { full_name: k, workshop: db.workshops.find((w) => w.id === u.workshop_id)?.name, points: 0, ideas: 0 }; top[k].points += x.points; top[k].ideas++; });
      return { total_ideas: sub.length, completed: done, rejected: cnt((i) => i.status === 'REJECTED'),
        pending_approval: cnt((i) => i.status.startsWith('PENDING')), in_progress: cnt((i) => ['QUICK_WIN', 'IMPLEMENTING'].includes(i.status)),
        quick_wins: cnt((i) => i.kaizen_type === 'QUICK_WIN'), major_projects: cnt((i) => i.kaizen_type === 'MAJOR'),
        completion_rate: active ? Math.round(done / active * 1000) / 10 : 0,
        estimated_saving: v.filter((i) => i.status !== 'REJECTED').reduce((s, i) => s + i.estimated_saving, 0),
        verified_saving: fin.reduce((s, f) => s + f.annual_saving, 0), verified_investment: fin.reduce((s, f) => s + f.investment_cost, 0),
        avg_leader_response_hours: leaderHrs.length ? Math.round(leaderHrs.reduce((a, b) => a + b, 0) / leaderHrs.length * 10) / 10 : 0,
        participants: new Set(sub.map((i) => i.submitter_id)).size,
        by_category: Object.entries(byCat).map(([category, total]) => ({ category, total })).sort((a, b) => b.total - a.total),
        top_contributors: Object.values(top).sort((a, b) => b.points - a.points) };
    }
    case 'GET /reports/roi': {
      const g = {};
      db.ideas.filter((i) => i.status === 'COMPLETED').forEach((i) => {
        const f = db.financials.find((x) => x.idea_id === i.id && x.verified); if (!f) return;
        const month = i.completed_at.slice(0, 7), w = listRow(i).workshop, k = month + w;
        g[k] ??= { month, workshop: w, projects: 0, investment: 0, annual_saving: 0 };
        g[k].projects++; g[k].investment += f.investment_cost; g[k].annual_saving += f.annual_saving;
      });
      return Object.values(g).map((x) => ({ ...x, roi_percent: x.investment ? Math.round((x.annual_saving - x.investment) / x.investment * 10000) / 100 : null,
        payback_months: x.annual_saving ? Math.round(x.investment / x.annual_saving * 1200) / 100 : null }));
    }
  }
  err(404, 'Endpoint không có trong bản demo');
}

function submit(i) {
  if (!['DRAFT', 'REVISION_REQUESTED'].includes(i.status)) err(409, 'Không thể gửi duyệt ở trạng thái ' + i.status);
  i.status = 'PENDING_LEADER'; i.submitted_at ??= now();
  db.approvals.push({ id: ++db.seq.ap, idea_id: i.id, level: 'LEADER', approver_role: 'LEADER', workshop_id: i.workshop_id, status: 'PENDING', created_at: now() });
}

async function mockApi(path, { method = 'GET', body, form } = {}, token) {
  if (!db) load();
  const c = token ? user(+String(token).split(':')[1]) : null;
  if (!c && path !== '/auth/login') err(401, 'missing token');
  const snapshot = JSON.stringify(db);
  try {
    const res = await handle(method, path, form || body, c);
    save();
    return JSON.parse(JSON.stringify(res ?? {}));
  } catch (e) {
    db = JSON.parse(snapshot); // roll back partial changes, like a DB transaction
    throw e;
  }
}

function mockFileUrl(id) {
  if (!db) load();
  return db.attachments.find((a) => a.id === +id)?.data || '';
}

// ---- offline.js ----
// Offline-first outbox: kaizen proposals (with photos) are stored in IndexedDB
// when the factory Wi-Fi is down, then synced automatically. client_uuid makes sync idempotent.

const DB = 'kaizen-offline', STORE = 'outbox';

function idb() {
  return new Promise((ok, fail) => {
    const req = indexedDB.open(DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: 'client_uuid' });
    req.onsuccess = () => ok(req.result);
    req.onerror = () => fail(req.error);
  });
}

async function tx(mode, fn) {
  const d = await idb();
  return new Promise((ok, fail) => {
    const t = d.transaction(STORE, mode);
    const r = fn(t.objectStore(STORE));
    t.oncomplete = () => ok(r && r.result);
    t.onerror = () => fail(t.error);
  });
}

const queue = (item) => tx('readwrite', (s) => s.put(item));
const pending = () => tx('readonly', (s) => s.getAll());
const remove = (id) => tx('readwrite', (s) => s.delete(id));

function toForm(item) {
  const f = new FormData();
  for (const [k, v] of Object.entries(item.fields)) if (v !== undefined && v !== null && v !== '') f.append(k, v);
  f.append('client_uuid', item.client_uuid);
  for (const file of item.files || []) f.append('before', file, file.name);
  return f;
}

let syncing = false;
async function sync(onDone) {
  if (syncing || !navigator.onLine) return 0;
  syncing = true;
  let n = 0;
  try {
    for (const item of await pending()) {
      try {
        await api('/kaizens', { method: 'POST', form: toForm(item) });
        await remove(item.client_uuid);
        n++;
      } catch (e) {
        if (e.status && e.status < 500) await remove(item.client_uuid); // permanently invalid
        else break; // network/server issue: retry later
      }
    }
  } finally { syncing = false; }
  if (n && onDone) onDone(n);
  return n;
}

const DEMO = !!window.KAIZEN_DEMO;

// Storage can throw (private mode, sandboxed frames): fall back to memory.
const mem = {};
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return mem[k] ?? null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch { mem[k] = v; } },
  del: (k) => { try { localStorage.removeItem(k); } catch { delete mem[k]; } },
};

const session = {
  get token() { return store.get('kz_token'); },
  get user() { try { return JSON.parse(store.get('kz_user')); } catch { return null; } },
  set(token, user) { store.set('kz_token', token); store.set('kz_user', JSON.stringify(user)); },
  clear() { store.del('kz_token'); store.del('kz_user'); },
};

class ApiError extends Error {
  constructor(status, msg) { super(msg); this.status = status; }
}

async function api(path, { method = 'GET', body, form } = {}) {
  if (DEMO) {
    try { return await mockApi(path, { method, body, form }, session.token); }
    catch (e) {
      if (e.status === 401 && path !== '/auth/login') { session.clear(); location.hash = '#/login'; }
      throw new ApiError(e.status || 500, e.message);
    }
  }
  const headers = {};
  if (session.token) headers.Authorization = 'Bearer ' + session.token;
  let payload;
  if (form) payload = form;
  else if (body !== undefined) { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
  const res = await fetch('/api/v1' + path, { method, headers, body: payload });
  if (res.status === 401 && path !== '/auth/login') { session.clear(); location.hash = '#/login'; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new ApiError(res.status, data.error || res.statusText);
  return data;
}

  $('#items').innerHTML = res.items.length ? res.items.map((k) => `
    <a class="card list-item" href="#/kaizen/${k.id}">
      ${k.thumb_id ? `<img class="thumb" loading="lazy" src="${fileUrl(k.thumb_id)}" alt="">` : '<div class="thumb"></div>'}
      <div class="grow"><div><b>${esc(k.title)}</b></div>
      <div class="meta">${esc(k.code)} · ${esc(k.category)} · ${esc(k.workshop)}${k.line ? ' / ' + esc(k.line) : ''} · ${esc(k.submitter)}</div>
      <div class="row" style="margin-top:4px">${badge(k.status)}${k.kaizen_type ? `<span class="badge">${esc(k.kaizen_type)}</span>` : ''}
      <span class="meta">${dt(k.created_at)}</span></div></div></a>`).join('')
    : '<div class="card">Chưa có sáng kiến nào. <a href="#/new">Gửi đề xuất đầu tiên</a></div>';
}

async function viewNew(_, params) {
  const [cats, master] = await Promise.all([api('/categories'), api('/master')]);
  let qrLine = null;
  if (params.get('line')) qrLine = await api('/lines/qr/' + encodeURIComponent(params.get('line'))).catch(() => null);
  const u = session.user;
  const lines = master.lines.filter((l) => !u.wid || l.workshop_id === u.wid);
  app.innerHTML = `<div class="card"><h2>Đề xuất sáng kiến mới</h2>
    ${qrLine ? `<p class="meta">📍 ${esc(qrLine.workshop_name)} / <b>${esc(qrLine.name)}</b> (quét QR)</p>` : ''}
    <form id="f">
      <label>Tiêu đề *</label><input name="title" required maxlength="255">
      <label>Lĩnh vực *</label><select name="category_id" required>${cats.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      ${qrLine ? `<input type="hidden" name="line_qr" value="${esc(params.get('line'))}">` : `
      <label>Dây chuyền</label><select name="line_id"><option value="">(theo hồ sơ của tôi)</option>
      ${lines.map((l) => `<option value="${l.id}">${esc(l.code)} - ${esc(l.name)}</option>`).join('')}</select>`}
      <label>Hiện trạng / Vấn đề (Before) *</label><textarea name="problem" required></textarea>
      <label>Giải pháp đề xuất *</label><textarea name="proposal" required></textarea>
      <label>Lợi ích mong đợi</label><textarea name="expected_benefit"></textarea>
      <label>Ước tính tiết kiệm / năm (VNĐ)</label><input name="estimated_saving" type="number" min="0" step="1000" value="0">
      <label>Ảnh / video hiện trường (Before)</label>
      <input name="before" type="file" accept="image/*,video/*" capture="environment" multiple>
      <p class="row"><button name="act" value="submit">Gửi duyệt</button><button class="sec" name="act" value="draft">Lưu nháp</button></p>
    </form></div>`;
  $('#f').onsubmit = async (e) => {
    e.preventDefault();
    const form = e.target, fd = new FormData(form);
    const fields = {};
    for (const [k, v] of fd.entries()) if (k !== 'before') fields[k] = v;
    fields.submit = String(e.submitter?.value !== 'draft');
    const item = { client_uuid: crypto.randomUUID(), fields, files: [...form.before.files] };
    form.querySelectorAll('button').forEach((b) => (b.disabled = true));
    if (!navigator.onLine) { await queue(item); toast('Đang offline – đã lưu, sẽ tự đồng bộ khi có mạng'); location.hash = '#/'; return; }
    try {
      const r = await api('/kaizens', { method: 'POST', form: toForm(item) });
      toast(`Đã tạo ${r.code}`); location.hash = '#/kaizen/' + r.id;
    } catch (err) {
      if (!err.status || err.status >= 500) { await queue(item); toast('Mất kết nối – đã lưu offline'); location.hash = '#/'; }
      else { toast(err.message); form.querySelectorAll('button').forEach((b) => (b.disabled = false)); }
    }
  };
}

async function viewDetail(id) {
  const k = await api('/kaizens/' + id);
  const u = session.user, r = role();
  const isOwner = k.assignee_id === u.uid, isSubmitter = k.submitter_id === u.uid;
  const imgs = (phase) => k.attachments.filter((a) => a.phase === phase).map((a) =>
    a.content_type.startsWith('image/') ? `<a href="${fileUrl(a.id)}" target="_blank"><img loading="lazy" src="${fileUrl(a.id)}" alt="${esc(a.file_name)}"></a>`
      : `<a href="${fileUrl(a.id)}" target="_blank">${esc(a.file_name)}</a>`).join('') || '<span class="meta">Chưa có</span>';
  const canTasks = isOwner || ['IE', 'ADMIN', 'LEADER'].includes(r);
  const working = ['QUICK_WIN', 'IMPLEMENTING'].includes(k.status);
  const canComplete = (k.status === 'QUICK_WIN' && (isOwner || ['LEADER', 'ADMIN'].includes(r)))
    || (k.status === 'IMPLEMENTING' && (isOwner || ['IE', 'ADMIN'].includes(r)));
  const f = k.financials;

  app.innerHTML = `<div class="card">
    <div class="row"><h2 class="grow">${esc(k.title)}</h2>${badge(k.status)}${k.kaizen_type ? `<span class="badge">${esc(k.kaizen_type)}</span>` : ''}</div>
    <div class="meta">${esc(k.code)} · ${esc(k.category)} · ${esc(k.workshop)}${k.line ? ' / ' + esc(k.line) : ''} · Người đề xuất: ${esc(k.submitter)}${k.assignee ? ' · Phụ trách: ' + esc(k.assignee) : ''}</div>
    <h3>Hiện trạng</h3><p>${esc(k.problem)}</p><h3>Giải pháp</h3><p>${esc(k.proposal)}</p>
    ${k.expected_benefit ? `<h3>Lợi ích</h3><p>${esc(k.expected_benefit)}</p>` : ''}
    <p class="meta">Ước tính tiết kiệm: <b>${money(k.estimated_saving)}</b>/năm</p>
    ${['DRAFT', 'REVISION_REQUESTED'].includes(k.status) && isSubmitter ? '<button id="submit">Gửi duyệt</button>' : ''}
  </div>
  <div class="card"><h3>Before</h3><div class="gallery">${imgs('BEFORE')}</div>
    <h3>After</h3><div class="gallery">${imgs('AFTER')}</div>
    ${working ? `<form id="up" class="row" style="margin-top:8px"><input type="file" name="files" accept="image/*,video/*" capture="environment" multiple class="grow" required><button>Tải ảnh After</button></form>` : ''}
    ${canComplete ? `<p><button id="complete">${k.status === 'QUICK_WIN' ? '✔ Hoàn thành Quick Win' : '✔ Hoàn thành – chuyển Kế toán thẩm định'}</button></p>` : ''}
  </div>
  ${k.kaizen_type === 'MAJOR' ? `<div class="card"><h3>Kanban triển khai</h3>
    <div class="kanban">${['TODO', 'IN_PROGRESS', 'DONE'].map((s) => `<div class="col"><h4>${s}</h4>${k.tasks.filter((t) => t.status === s).map((t) => `
      <div class="task"><b>${esc(t.title)}</b>${t.assignee ? `<div class="meta">${esc(t.assignee)}</div>` : ''}${t.due_date ? `<div class="meta">Hạn: ${esc(t.due_date.slice(0, 10))}</div>` : ''}
      ${working && canTasks ? `<div>${s !== 'TODO' ? `<button class="sec" data-t="${t.id}" data-s="${s === 'DONE' ? 'IN_PROGRESS' : 'TODO'}">◀</button>` : ''}
      ${s !== 'DONE' ? `<button data-t="${t.id}" data-s="${s === 'TODO' ? 'IN_PROGRESS' : 'DONE'}">▶</button>` : ''}</div>` : ''}</div>`).join('')}</div>`).join('')}</div>
    ${canTasks && ['IMPLEMENTING', 'PENDING_IE'].includes(k.status) ? `<form id="task" class="row" style="margin-top:8px"><input name="title" placeholder="Công việc mới" required class="grow" style="width:auto"><input name="due_date" type="date" style="width:auto"><button>Thêm</button></form>` : ''}
  </div>` : ''}
  ${f || ['IE', 'FINANCE', 'ADMIN'].includes(r) && k.kaizen_type === 'MAJOR' ? `<div class="card"><h3>Tài chính / ROI</h3>
    ${f ? `<table><tr><td>Chi phí đầu tư</td><td class="num">${money(f.investment_cost)}</td></tr>
      <tr><td>Tiết kiệm / năm</td><td class="num">${money(f.annual_saving)}</td></tr>
      <tr><td>ROI</td><td class="num">${f.roi_percent != null ? f.roi_percent + ' %' : '—'}</td></tr>
      <tr><td>Hoàn vốn</td><td class="num">${f.payback_months != null ? f.payback_months + ' tháng' : '—'}</td></tr>
      <tr><td>Kế toán xác thực</td><td class="num">${f.verified ? '✔ ' + dt(f.verified_at) : 'Chưa'}</td></tr></table>` : '<p class="meta">Chưa có số liệu</p>'}
    ${['IE', 'FINANCE', 'ADMIN'].includes(r) && !['COMPLETED', 'REJECTED'].includes(k.status) ? `<form id="fin" class="row" style="margin-top:8px">
      <input name="investment_cost" type="number" min="0" placeholder="Chi phí đầu tư" class="grow" style="width:auto" value="${f?.investment_cost ?? ''}">
      <input name="annual_saving" type="number" min="0" placeholder="Tiết kiệm/năm" class="grow" style="width:auto" value="${f?.annual_saving ?? ''}"><button>Lưu</button></form>` : ''}
  </div>` : ''}
  <div class="card"><h3>Lịch sử phê duyệt</h3><ul class="timeline">${k.approvals.map((a) => `<li><b>${esc(a.level)}</b> – ${esc(a.status)}
    ${a.acted_by ? ' bởi ' + esc(a.acted_by) : ''} <span class="meta">${dt(a.acted_at || a.created_at)}</span>${a.comment ? `<div>“${esc(a.comment)}”</div>` : ''}</li>`).join('') || '<li class="meta">Chưa gửi duyệt</li>'}</ul>
    ${k.rewards.length ? `<h3>Khen thưởng</h3>${k.rewards.map((w) => `<div>🏆 ${esc(w.full_name)}: <b>${w.points} điểm</b>${w.amount ? ' + ' + money(w.amount) : ''}</div>`).join('')}` : ''}
  </div>`;

  const reload = () => viewDetail(id);
  const act = async (fn, ok) => { try { await fn(); if (ok) toast(ok); reload(); } catch (e) { toast(e.message); } };
  $('#submit')?.addEventListener('click', () => act(() => api(`/kaizens/${id}/submit`, { method: 'POST' }), 'Đã gửi duyệt'));
  $('#complete')?.addEventListener('click', () => act(() => api(`/kaizens/${id}/complete`, { method: 'POST' }), 'Đã cập nhật'));
  $('#up')?.addEventListener('submit', (e) => {
    e.preventDefault(); const fd = new FormData(e.target); fd.append('phase', 'AFTER');
    act(() => api(`/kaizens/${id}/attachments`, { method: 'POST', form: fd }), 'Đã tải ảnh');
  });
  $('#task')?.addEventListener('submit', (e) => {
    e.preventDefault(); act(() => api(`/kaizens/${id}/tasks`, { method: 'POST', body: Object.fromEntries(new FormData(e.target)) }));
  });
  $('#fin')?.addEventListener('submit', (e) => {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target));
    act(() => api(`/kaizens/${id}/financials`, { method: 'PUT', body: { investment_cost: +v.investment_cost || 0, annual_saving: +v.annual_saving || 0 } }), 'Đã lưu');
  });
  app.querySelectorAll('[data-t]').forEach((b) => b.addEventListener('click', () =>
    act(() => api(`/kaizens/tasks/${b.dataset.t}/status`, { method: 'PATCH', body: { status: b.dataset.s } }))));
}

async function viewApprovals() {
  const list = await api('/approvals/pending');
  app.innerHTML = `<h2>Chờ tôi phê duyệt (${list.length})</h2>` + (list.map((a) => `
    <div class="card" data-ap="${a.approval_id}">
      <div class="row"><a class="grow" href="#/kaizen/${a.idea_id}"><b>${esc(a.title)}</b></a><span class="badge">${esc(a.level)}</span>
      <span class="badge ${a.waiting_hours >= 48 ? 's-REJECTED' : ''}">${a.waiting_hours}h</span></div>
      <div class="meta">${esc(a.code)} · ${esc(a.category)} · ${esc(a.workshop)} · ${esc(a.submitter)} · Ước tính ${money(a.estimated_saving)}</div>
      <textarea placeholder="Ý kiến phản hồi (bắt buộc khi từ chối / yêu cầu sửa)" style="margin-top:8px"></textarea>
      ${a.level === 'FINANCE' ? `<div class="row"><input data-k="investment_cost" type="number" min="0" placeholder="Chi phí đầu tư xác thực" class="grow" style="width:auto"><input data-k="annual_saving" type="number" min="0" placeholder="Tiết kiệm/năm xác thực" class="grow" style="width:auto"></div>` : ''}
      <div class="row" style="margin-top:8px">
        ${a.level === 'LEADER' ? `<button data-a="APPROVE" data-type="QUICK_WIN">✔ Quick Win</button><button data-a="APPROVE" data-type="MAJOR">✔ Dự án lớn → IE</button>`
          : '<button data-a="APPROVE">✔ Phê duyệt</button>'}
        <button class="sec" data-a="REVISION">Yêu cầu sửa</button><button class="danger" data-a="REJECT">✖ Từ chối</button>
      </div></div>`).join('') || '<div class="card">Không có sáng kiến nào chờ duyệt 🎉</div>');
  app.querySelectorAll('[data-a]').forEach((b) => b.addEventListener('click', async () => {
    const card = b.closest('[data-ap]');
    const body = { action: b.dataset.a, comment: card.querySelector('textarea').value, kaizen_type: b.dataset.type };
    card.querySelectorAll('[data-k]').forEach((i) => { if (i.value !== '') body[i.dataset.k] = +i.value; });
    try { const r = await api(`/approvals/${card.dataset.ap}/action`, { method: 'POST', body }); toast('→ ' + (STATUS[r.status] || r.status)); viewApprovals(); }
    catch (e) { toast(e.message); }
  }));
}

async function viewDashboard() {
  const s = await api('/reports/summary');
  const roi = ['IE', 'FINANCE', 'DIRECTOR', 'ADMIN', 'LEADER'].includes(role()) ? await api('/reports/roi').catch(() => []) : [];
  const me = await api('/auth/me');
  const max = Math.max(1, ...s.by_category.map((c) => c.total));
  app.innerHTML = `<h2>Dashboard Kaizen</h2>
    <div class="stats">
      ${[['Tổng ý tưởng', s.total_ideas], ['Hoàn thành', s.completed], ['Tỷ lệ hoàn thành', s.completion_rate + ' %'], ['Đang chờ duyệt', s.pending_approval],
        ['Đang triển khai', s.in_progress], ['Quick Win / Dự án', `${s.quick_wins} / ${s.major_projects}`], ['Người tham gia', s.participants],
        ['TG sơ duyệt TB', s.avg_leader_response_hours + ' h'], ['Tiết kiệm ước tính', money(s.estimated_saving)],
        ['Tiết kiệm đã xác thực', money(s.verified_saving)], ['Điểm của tôi', me.total_points]]
        .map(([l, v]) => `<div class="stat"><b>${esc(v)}</b><span>${l}</span></div>`).join('')}
    </div>
    <div class="card" style="margin-top:12px"><h3>Theo lĩnh vực</h3>${s.by_category.map((c) => `
      <div class="row"><span style="width:180px">${esc(c.category)}</span><div class="grow"><div class="bar" style="width:${(c.total / max) * 100}%"></div></div><b>${c.total}</b></div>`).join('') || '<span class="meta">Chưa có dữ liệu</span>'}</div>
    <div class="card"><h3>Top đóng góp</h3><table><tr><th>Nhân viên</th><th>Xưởng</th><th class="num">Ý tưởng</th><th class="num">Điểm</th></tr>
      ${s.top_contributors.map((t) => `<tr><td>${esc(t.full_name)}</td><td>${esc(t.workshop)}</td><td class="num">${t.ideas}</td><td class="num">${t.points}</td></tr>`).join('')}</table></div>
    ${roi.length ? `<div class="card"><h3>ROI theo xưởng / tháng</h3><div class="table-wrap"><table><tr><th>Tháng</th><th>Xưởng</th><th class="num">Dự án</th><th class="num">Đầu tư</th><th class="num">Tiết kiệm/năm</th><th class="num">ROI</th><th class="num">Hoàn vốn</th></tr>
      ${roi.map((x) => `<tr><td>${esc(x.month)}</td><td>${esc(x.workshop)}</td><td class="num">${x.projects}</td><td class="num">${money(x.investment)}</td><td class="num">${money(x.annual_saving)}</td><td class="num">${x.roi_percent ?? '—'} %</td><td class="num">${x.payback_months ?? '—'} th</td></tr>`).join('')}</table></div></div>` : ''}`;
}

// ---------------- boot ----------------
if (!DEMO && 'serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
if (DEMO) document.body.classList.add('demo');
updateNet();
render();
sync((k) => toast(`Đã đồng bộ ${k} sáng kiến`));
setInterval(() => sync((k) => toast(`Đã đồng bộ ${k} sáng kiến`)), 30000);

</script>
</body>
