<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1c17">
  <meta name="description" content="Hệ thống quản lý Kaizen và sáng kiến cải tiến nhà máy">
  <title>Digital Kaizen</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="login" hidden></div>
  <div class="shell" id="shell" hidden>
    <aside class="side" id="side" aria-label="Điều hướng chính"></aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="top">
        <button class="icon-btn menu-btn" id="menu" aria-label="Mở menu"></button>
        <div class="crumb" id="crumb"></div>
        <span id="demo-tag"></span>
        <span class="net" id="net"><span class="net-txt">Trực tuyến</span></span>
        <a class="btn top-new" href="#/new" id="top-new"></a>
      </header>
      <main id="app"></main>
    </div>
    <nav class="tabbar" id="tabbar" aria-label="Điều hướng nhanh"></nav>
  </div>
  <div id="tip" class="tip" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
